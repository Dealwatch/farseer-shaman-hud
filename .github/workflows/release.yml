name: Release

# Publish a release on GitHub (Releases > Draft a new release, new tag vX.Y.Z on main).
# This job then runs the offline test and attaches the addon zip and release.json
# (flavor "forever", read by WowUp) to that release.
# Without the GitHub page: push the tag vX.Y.Z, then run this workflow on that tag
# (Actions > Release > Run workflow); the packager creates the release itself.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Smoke test
        run: sudo apt-get install -y lua5.1 && lua5.1 tests/run.lua
      - name: Package and attach to the GitHub release
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      # The packager writes the commit log as release text; use the CHANGELOG.md section instead.
      - name: Release text from CHANGELOG.md
        if: github.event_name == 'release' || github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          version=$(sed -n 's/^## Version: *//p' FarseerShamanHUD.toc | tr -d '\r')
          awk -v v="## $version" '$0==v{f=1;next} /^## /{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no section '## $version'"; exit 1; }
          gh release edit "$TAG" --notes-file notes.md
